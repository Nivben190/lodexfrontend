<div class="lx-sheet-backdrop" (click)="onBackdropClick($event)">
  <div class="lx-sheet" role="dialog" aria-label="הוספת פריט לארון">
    <span class="lx-sheet-handle"></span>
    <button class="lx-sheet-close" type="button" (click)="close()" aria-label="סגור">
      <lx-icon name="x" [size]="17"></lx-icon>
    </button>

    <h3 class="lx-sheet-title">הוסיפי פריט לארון</h3>

    <!-- `capture` is deliberately absent so the picker offers camera *and* library. -->
    <input
      #fileInput
      class="lx-visually-hidden"
      type="file"
      accept="image/jpeg,image/png,image/webp"
      (change)="onFileSelected($event)"
    />

    <button
      class="lx-upload"
      type="button"
      [disabled]="uploading()"
      (click)="fileInput.click()"
    >
      @if (uploading()) {
        <span class="lx-upload-spinner" aria-hidden="true"></span>
        <span>מעלה תמונה...</span>
      } @else if (previewUrl()) {
        <img [src]="previewUrl()!" alt="תצוגה מקדימה" />
        <span class="lx-upload-swap">החלפת תמונה</span>
      } @else {
        <lx-icon name="image-plus" [size]="26"></lx-icon>
        <span>העלאת תמונה מהמכשיר</span>
      }
    </button>

    @if (uploadError(); as err) {
      <p class="lx-upload-error">{{ err }}</p>
    }

    <label class="lx-field">
      <span class="lx-field-label">שם הפריט</span>
      <input type="text" [(ngModel)]="form.name" placeholder="למשל: חולצת פשתן לבנה" />
    </label>

    <label class="lx-field">
      <span class="lx-field-label">מותג</span>
      <input type="text" [(ngModel)]="form.brand" placeholder="למשל: Zara" />
    </label>

    <div class="lx-field">
      <span class="lx-field-label">קטגוריה</span>
      <div class="lx-chip-row lx-scroll-x">
        @for (cat of categories; track cat) {
          <button
            type="button"
            class="lx-chip"
            [class.is-active]="form.category === cat"
            (click)="form.category = cat"
          >{{ cat }}</button>
        }
      </div>
    </div>

    <div class="lx-field">
      <span class="lx-field-label">צבע</span>
      <div class="lx-color-row">
        @for (color of colors; track color.name) {
          <button
            type="button"
            class="lx-swatch"
            [class.is-active]="form.color === color.name"
            [style.background]="color.hex"
            [title]="color.name"
            [attr.aria-label]="color.name"
            (click)="selectColor(color)"
          ></button>
        }
      </div>
    </div>

    <div class="lx-field">
      <span class="lx-field-label">עונה</span>
      <div class="lx-chip-row lx-scroll-x">
        @for (season of seasons; track season) {
          <button
            type="button"
            class="lx-chip"
            [class.is-active]="form.season === season"
            (click)="form.season = season"
          >{{ season }}</button>
        }
      </div>
    </div>

    <div class="lx-field">
      <span class="lx-field-label">רמת פורמליות</span>
      <div class="lx-chip-row lx-scroll-x">
        @for (level of formalityOptions; track level) {
          <button
            type="button"
            class="lx-chip"
            [class.is-active]="form.formality === level"
            (click)="form.formality = level"
          >{{ level }}</button>
        }
      </div>
    </div>

    <button class="lx-primary-btn" [disabled]="!form.name.trim() || saving()" (click)="submit()">
      {{ saving() ? 'שומרת...' : 'הוסיפי לארון' }}
    </button>
  </div>
</div>
