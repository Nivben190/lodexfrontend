<header class="lx-header">
  <span class="lx-wordmark hebrew-serif">LOOXDEX</span>

  @if (weather(); as look) {
    <span class="lx-weather">
      <span class="lx-weather-icon">{{ look.weather.icon }}</span>
      <span>{{ look.weather.tempCelsius }}°C</span>
      <span class="lx-weather-sep">|</span>
      <span>{{ look.weather.city }}</span>
    </span>
  }
</header>
