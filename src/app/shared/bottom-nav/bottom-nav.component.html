<nav class="lx-dock" aria-label="ניווט ראשי">
  @for (tab of tabs; track tab.path) {
    <a
      class="lx-dock-item"
      [routerLink]="tab.path"
      routerLinkActive="is-active"
      [attr.aria-label]="tab.label"
    >
      <lx-icon [name]="tab.icon" [size]="21"></lx-icon>
    </a>
  }
</nav>
